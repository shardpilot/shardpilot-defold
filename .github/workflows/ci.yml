name: ci

on:
  pull_request:
  # ⚠ EVERY PUSH, NOT ONLY main. This repository is PUBLIC: a branch pushed here
  # is readable the moment it lands, whether or not a pull request ever opens.
  # A `branches: [main]` filter meant the secret scan and the publication gate
  # skipped exactly the case where the contents are already exposed and nobody
  # is looking. Tags are included for the same reason and a stronger one — a tag
  # is the artifact people install, and one release here was cut off-main.
  #
  # No job is conditioned to narrow this back down. A condition is how a gate
  # stops running without anyone noticing, which is the failure being fixed; the
  # cost of running the rest of the suite on a branch push is CI minutes.
  push:

# ⚠ NO WORKFLOW-LEVEL CONCURRENCY, DELIBERATELY. `cancel-in-progress` at this
# level cancels the run for a superseded push — which is exactly the disclosure
# case: a branch pushed with a credential and force-pushed a minute later. The
# cancelled run never scanned the commit that was public, and the replacement
# run checks out history in which that commit is no longer reachable, so not
# even the `--log-opts=--all` pass can reach it. Cancelling a security scan on
# the grounds that a newer commit exists is cancelling it for the one push that
# mattered.
#
# So the publication-sensitive jobs carry no concurrency group at all and always
# run to completion. The rest opt in per job, keyed by job as well as ref so
# they do not queue behind one another.

jobs:
  # Workspace security baseline, mirroring the pattern the other SDK
  # repositories already run (godot/unity/unreal/cli). Both passes: the working
  # tree and the full history across all refs, so a secret can neither live at
  # HEAD nor hide in an earlier commit. Exact-pinned image.
  #
  # There IS a .gitleaks.toml here, and it carries no `paths` clause on purpose:
  # measured against v8.30.1, an allowlist with `paths` excuses the whole FILE
  # even with condition = "AND", and the files needing exceptions are test files
  # — the likeliest place for a pasted credential. Exceptions name the literal.
  #
  # ⚠ THIS REPOSITORY IS PUBLIC, which inverts the usual urgency. Everywhere
  # else a missing secret scan is a gap to close before a visibility flip; here
  # a credential is exposed at the moment it is pushed. It was measured on
  # 2026-08-20 that this was one of only two candidate repositories running no
  # secret scanner at all — and the only two already public.
  #
  # fetch-depth: 0 is required by the history pass and by nothing else in this
  # workflow.
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch pull-request refs for the history scan
        run: git fetch origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - name: Scan working tree for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: dir --verbose --redact /github/workspace

      - name: Scan git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --verbose --redact --log-opts=--all /github/workspace
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # No fetch-depth here on purpose. The gate's roster rule now asks whether
      # each literal still appears in the TRACKED TREE, which a one-commit clone
      # answers perfectly well — the earlier `fetch-depth: 0` existed only for
      # the history-based version of that rule and was pure cost once the rule
      # changed. Verified by cloning this branch with --depth 1 and running the
      # gate: exit 0.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Static library checks
        run: ./scripts/check_library.sh

      - name: Version consistency
        run: ./scripts/check_versions.sh

      # ⚠ THE COMPARISON BASE IS SUPPLIED, AND UNTIL NOW IT WAS NOT. The gate
      # compares the lane B baseline against the merge target so that a change
      # cannot add material and regenerate the baseline upward in one commit.
      # That comparison is skipped when PUBLIC_SURFACE_BASE_REF is unset — and
      # this workflow never set it, so on every run since the ratchet landed the
      # skip branch was taken. The gate even printed "CI sets it", which was
      # false in this repository: a check that never runs is worse than an
      # absent one, because it manufactures the appearance of a check.
      #
      # The cases are distinguished rather than guessed. A pull request carries
      # its own base sha; a push to an existing branch carries the ref's previous
      # tip; a NEWLY CREATED ref carries the all-zero sha.
      #
      # ⚠ AND THE NEW-REF CASE READS THE EVENT'S SHA, NOT THE REF. The first fix
      # for it fetched `github.ref` two deep and took FETCH_HEAD^. A ref is
      # MUTABLE: if a second push lands before this step runs, that resolves the
      # live tip, and when the later tip is a child of the event commit,
      # FETCH_HEAD^ IS the event commit -- so the push that added lane B material
      # and raised its baseline is compared against its own raised baseline and
      # passes. Reproduced: with the ref moved on, FETCH_HEAD^ read back the very
      # commit under test, while the event sha's parent read back the commit
      # before it. `github.sha` is fixed for the event, so the history is deepened
      # by one and its parent is used.
      #
      # ⚠ AND FOR THAT LAST ONE THE DEFAULT BRANCH IS THE WRONG ANSWER, WHICH
      # THIS COMMENT USED TO ASSERT WAS THE RIGHT ONE. Every branch and tag push
      # is scanned here, including off-main releases. If main already carries a
      # higher count for a file, a new branch compared against MAIN can add an
      # occurrence, raise its own baseline, and still pass -- it borrows slack
      # from a branch it does not descend from. The comparison a new ref needs is
      # its own parent. So the ref is fetched --depth=2 and FETCH_HEAD^ is used;
      # depth 2 because one tree is read and one parent is needed, nothing more.
      #
      # The default branch survives only as the last resort for a ref whose tip
      # has no parent at all -- a root commit, where there is no ancestry to
      # compare with and no better answer exists. Measured on a genuinely shallow
      # clone (file:// so --depth is honoured): after --depth=2 on a new branch,
      # FETCH_HEAD^ resolves to the commit the branch was cut from, not to the
      # default branch's tip.
      - name: Fetch the comparison base for the lane B ratchet
        run: |
          set -euo pipefail
          base_sha='${{ github.event.pull_request.base.sha }}'
          before='${{ github.event.before }}'
          sha='${{ github.sha }}'
          zero='0000000000000000000000000000000000000000'
          if [ -n "$base_sha" ]; then
            git fetch --depth=1 origin "$base_sha"
            echo "SP_LANE_B_BASE=FETCH_HEAD" >> "$GITHUB_ENV"
          elif [ -n "$before" ] && [ "$before" != "$zero" ]; then
            git fetch --depth=1 origin "$before"
            echo "SP_LANE_B_BASE=FETCH_HEAD" >> "$GITHUB_ENV"
          elif git rev-parse --verify --quiet "$sha^" >/dev/null \
               || { git fetch --deepen=1 origin >/dev/null 2>&1 \
                    && git rev-parse --verify --quiet "$sha^" >/dev/null; }; then
            echo "SP_LANE_B_BASE=$sha^" >> "$GITHUB_ENV"
          else
            git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
            echo "SP_LANE_B_BASE=FETCH_HEAD" >> "$GITHUB_ENV"
          fi

      # This repository is already public, so it is NOT in the org's
      # publication-candidate list and nothing else scans it. The script's
      # header states which lane is gated and which is only reported.
      - name: No internal material in the published non-source surface
        run: ./scripts/check_public_surface.sh
        env:
          PUBLIC_SURFACE_BASE_REF: ${{ env.SP_LANE_B_BASE }}

  # ⚠ ITS OWN JOB, AND THE SHARED CLOCK IS WHY. This ran inside `static`, whose
  # budget is ten minutes shared with checkout, syntax, the library and version
  # checks and a full surface scan. Review reported it still inside its
  # `--write-baseline` control after **more than thirteen minutes** and killed
  # it — so on that runner the required check was cancelled before it could
  # report anything, which reads as an outage rather than as a check that got
  # expensive.
  #
  # ⚠ THE SLOW OBSERVATION IS A FLOOR, NOT A DURATION. It did not finish, so no
  # bound can be derived from it honestly: 13 minutes over at most 14 controls
  # is at least 55s per control, and the true figure is unknown. Measured here
  # for contrast, on this tree: 143s for 14 controls, 10.2s per control. That is
  # a 5.5x spread between environments, and the slow one is not reproducible
  # here.
  #
  # ⚠ AND THE COUNT MOVED UNDER THE ARGUMENT. That reasoning was written for
  # FOURTEEN controls, which is what this harness had before the sibling's
  # lineage was ported into it, and this harness is at 40 controls now. The
  # bound is re-argued from a measurement taken at the SHIPPING count: a figure
  # derived for a different configuration is not a measurement of this one,
  # which is the mistake this comment already records the sibling making.
  #
  # Measured on this rig: 353.7s for 35 controls, 10.1s each (2026-08-31). The
  # slow review datum -- 55s per control -- stays a floor rather than a duration,
  # because that run did not finish. The budget is sized from the floor, not from
  # the fast rig: 40 x 55s is 2200s, so the arithmetic demands 37 minutes.
  #
  # Shipping 50 rather than 39. The floor is what the control enforces; the
  # margin above it is a separate decision, and 40 would have been one control
  # from red -- a bound that has to be revisited by the next person to add a
  # check is a bound that will be raised in a hurry rather than argued. Fifty
  # carries eight more controls before the arithmetic speaks again. This is
  # margin over a measured floor, not a guess in place of one.
  #
  # THIS NUMBER IS NOW CHECKED, not asserted. The harness reads timeout-minutes
  # for this job back out of this file and fails if it is under the count times
  # the slow constant, so adding a control raises the floor by itself. That
  # control exists because the previous version of this paragraph derived 20
  # minutes for FOURTEEN controls and survived the move to 35 unchanged.
  #
  # If the bound is ever exceeded, the reading is NOT "raise it again": a
  # control harness whose cost per control varies 5.5x between runners has a
  # hang, not a performance problem, and the `--write-baseline` control is
  # where the slow run was seen.
  #
  # ⚠ NO env HERE, deliberately: every comparison target is synthesized from
  # HEAD, so a CI-provided base ref could only replace a target the harness
  # built on purpose. It needs no network and no history depth.
  lane-b-ratchet-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ⚠ THE GATE PASSING SAYS NOTHING ABOUT WHETHER ITS CHECKS STILL EXIST.
      # In shardpilot-go, two of the lane B ratchet's review findings were checks
      # that had been correct two rounds earlier and were dropped in a
      # restructure -- and both survived a green run of the gate. This drives
      # each refusal to its condition and fails when one stops firing.
      - name: Every lane B refusal still fires
        run: ./scripts/test_lane_b_ratchet.sh

  # Engine-real leg: proves on every PR that the WORKING TREE still packages
  # and builds as a real Defold library dependency — scripts/package_release.sh
  # ZIP served over localhost, resolved and compiled by a pinned,
  # sha256-verified bob.jar (`java -jar bob.jar resolve build` on
  # test/bob-harness, whose main script requires the shardpilot.* modules).
  # HONESTY: this is a build-time proof only (dependency resolution +
  # compilation); it does NOT start the engine or exercise runtime behavior —
  # runtime coverage stays with the interpreter-based lua-tests legs.
  # All pins (Defold version, engine sha1, bob.jar sha256, dependency port)
  # live in scripts/ci_bob_build.sh; the cache key hashes that script, so a
  # pin bump automatically refreshes the cached bob.jar.
  bob-build:
    runs-on: ubuntu-latest
    concurrency:
      # ⚠ A LITERAL JOB NAME, NOT `github.job`. That context is not populated
      # when the group is evaluated, so every job sharing an event and a ref
      # collapsed into ONE group and they cancelled each other — one gate lost
      # per run, whichever started second. It was visible as a single cancelled
      # check with no competing run to explain it.
      # ⚠ THE EVENT IS PART OF THE GROUP. A push and a pull_request run on the
      # same commit are different work to CI, and without it they cancelled
      # each other — leaving a cancelled check on the pull request, which reads
      # as a failure and blocks the merge it was never about.
      group: ${{ github.workflow }}-${{ github.event_name }}-bob-build-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Defold 1.12.0 and newer require OpenJDK 25 (docs/release.md).
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache bob.jar
        uses: actions/cache@v6
        with:
          path: .ci-cache/bob
          key: bob-${{ runner.os }}-${{ hashFiles('scripts/ci_bob_build.sh') }}

      - name: Engine-real library build (bob resolve + build)
        run: ./scripts/ci_bob_build.sh

  # Defold embeds Lua 5.1 / LuaJIT, so those interpreters are the gating
  # legs. Lua 5.4 stays as an extra host leg only to catch accidental
  # reliance on 5.1-only quirks — it is NOT a runtime the SDK targets.
  lua-tests:
    runs-on: ubuntu-latest
      # ⚠ THE MATRIX AXIS IS PART OF THE GROUP. Without it every leg of the
      # matrix shares one group, and `cancel-in-progress` has the legs cancel
      # each other as they start — leaving one runtime tested and the others
      # reported as nothing at all. A gate that silently drops legs is the
      # failure this whole change is about.
    concurrency:
      # ⚠ A LITERAL JOB NAME, NOT `github.job`. That context is not populated
      # when the group is evaluated, so every job sharing an event and a ref
      # collapsed into ONE group and they cancelled each other — one gate lost
      # per run, whichever started second. It was visible as a single cancelled
      # check with no competing run to explain it.
      # ⚠ THE EVENT IS PART OF THE GROUP. A push and a pull_request run on the
      # same commit are different work to CI, and without it they cancelled
      # each other — leaving a cancelled check on the pull request, which reads
      # as a failure and blocks the merge it was never about.
      group: ${{ github.workflow }}-${{ github.event_name }}-lua-tests-${{ matrix.interpreter }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - interpreter: lua5.1
            package: lua5.1
          - interpreter: luajit
            package: luajit
          - interpreter: lua5.4
            package: lua5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ${{ matrix.interpreter }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.package }}

      - name: Lua tests
        run: ${{ matrix.interpreter }} test/test_sdk.lua

      - name: Lua crash tests
        run: ${{ matrix.interpreter }} test/test_crash.lua

      - name: Lua remote-config tests
        run: ${{ matrix.interpreter }} test/test_remote_config.lua

      - name: Lua experiments tests
        run: ${{ matrix.interpreter }} test/test_experiments.lua

      - name: Lua platform-fold conformance tests
        run: ${{ matrix.interpreter }} test/test_platform_fold.lua

      # A5: allocation bytes per track(), the metric that matters on a game
      # client — a per-frame allocation is somebody's GC pause, and it is the
      # one cost an engine integration cannot hide on a background thread.
      #
      # Across the WHOLE matrix, because luajit is what Defold actually ships:
      # the reference interpreter's byte counts are indicative, LuaJIT's are the
      # ones a studio would feel. Running both is the comparison.
      #
      # The harness gates itself — every event must enqueue and none may drop —
      # because its first version measured a full queue taking the drop path and
      # printed a table in which allocation FELL as the props got richer.
      - name: Track() allocation benchmark
        run: ${{ matrix.interpreter }} test/bench_sdk.lua | tee bench-${{ matrix.interpreter }}.txt

      - name: Publish benchmark results
        run: |
          {
            echo "### track() allocation — ${{ matrix.interpreter }}"
            echo
            echo '```'
            cat bench-${{ matrix.interpreter }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A6: the spool's cost under sustained overflow. The assertion that
      # holds this lives in test_sdk.lua (estimates per append, counted); this
      # prints the numbers behind docs/SPOOL_OVERFLOW_LATENCY_BOUND.md so a
      # regression is visible as a shape and not only as a failed bound.
      - name: Spool overflow benchmark
        run: ${{ matrix.interpreter }} test/bench_spool_append.lua | tee spool-${{ matrix.interpreter }}.txt

      - name: Publish spool benchmark results
        run: |
          {
            echo "### spool overflow — ${{ matrix.interpreter }}"
            echo
            echo '```'
            cat spool-${{ matrix.interpreter }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
