name: ci

on:
  pull_request:
  push:
    branches:
      - main
    # ⚠ TAGS TOO. A tag push creates the public archive this gate protects, and
    # `v0.10.1` was cut off-main as a deletion-only patch — so a
    # branches-only trigger would never have scanned the tree that actually
    # publishes. A gate that runs on the branch and not on the artifact is
    # guarding the wrong thing.
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Workspace security baseline, mirroring the pattern the other SDK
  # repositories already run (godot/unity/unreal/cli). Both passes: the working
  # tree and the full history across all refs, so a secret can neither live at
  # HEAD nor hide in an earlier commit. Exact-pinned image; no .gitleaks.toml,
  # because an allowlist entry is added only for a real, named false positive.
  #
  # ⚠ THIS REPOSITORY IS PUBLIC, which inverts the usual urgency. Everywhere
  # else a missing secret scan is a gap to close before a visibility flip; here
  # a credential is exposed at the moment it is pushed. It was measured on
  # 2026-08-20 that this was one of only two candidate repositories running no
  # secret scanner at all — and the only two already public.
  #
  # fetch-depth: 0 is required by the history pass and by nothing else in this
  # workflow.
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan working tree for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: dir --verbose --redact /github/workspace

      - name: Scan git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --verbose --redact --log-opts=--all /github/workspace
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # No fetch-depth here on purpose. The gate's roster rule now asks whether
      # each literal still appears in the TRACKED TREE, which a one-commit clone
      # answers perfectly well — the earlier `fetch-depth: 0` existed only for
      # the history-based version of that rule and was pure cost once the rule
      # changed. Verified by cloning this branch with --depth 1 and running the
      # gate: exit 0.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Static library checks
        run: ./scripts/check_library.sh

      - name: Version consistency
        run: ./scripts/check_versions.sh

      # This repository is already public, so it is NOT in the org's
      # publication-candidate list and nothing else scans it. The script's
      # header states which lane is gated and which is only reported.
      - name: No internal material in the published non-source surface
        run: ./scripts/check_public_surface.sh

  # Engine-real leg: proves on every PR that the WORKING TREE still packages
  # and builds as a real Defold library dependency — scripts/package_release.sh
  # ZIP served over localhost, resolved and compiled by a pinned,
  # sha256-verified bob.jar (`java -jar bob.jar resolve build` on
  # test/bob-harness, whose main script requires the shardpilot.* modules).
  # HONESTY: this is a build-time proof only (dependency resolution +
  # compilation); it does NOT start the engine or exercise runtime behavior —
  # runtime coverage stays with the interpreter-based lua-tests legs.
  # All pins (Defold version, engine sha1, bob.jar sha256, dependency port)
  # live in scripts/ci_bob_build.sh; the cache key hashes that script, so a
  # pin bump automatically refreshes the cached bob.jar.
  bob-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Defold 1.12.0 and newer require OpenJDK 25 (docs/release.md).
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache bob.jar
        uses: actions/cache@v6
        with:
          path: .ci-cache/bob
          key: bob-${{ runner.os }}-${{ hashFiles('scripts/ci_bob_build.sh') }}

      - name: Engine-real library build (bob resolve + build)
        run: ./scripts/ci_bob_build.sh

  # Defold embeds Lua 5.1 / LuaJIT, so those interpreters are the gating
  # legs. Lua 5.4 stays as an extra host leg only to catch accidental
  # reliance on 5.1-only quirks — it is NOT a runtime the SDK targets.
  lua-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - interpreter: lua5.1
            package: lua5.1
          - interpreter: luajit
            package: luajit
          - interpreter: lua5.4
            package: lua5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ${{ matrix.interpreter }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.package }}

      - name: Lua tests
        run: ${{ matrix.interpreter }} test/test_sdk.lua

      - name: Lua crash tests
        run: ${{ matrix.interpreter }} test/test_crash.lua

      - name: Lua remote-config tests
        run: ${{ matrix.interpreter }} test/test_remote_config.lua

      - name: Lua experiments tests
        run: ${{ matrix.interpreter }} test/test_experiments.lua
